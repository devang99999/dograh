name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Optional PAT (RELEASE_PLEASE_TOKEN) triggers downstream workflows on
          # release publish. Falls back to GITHUB_TOKEN for forks without the secret.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}